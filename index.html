<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卡密验证中心</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 50%, #f8bbd0 100%);
    color: #5a3e4b;
}
body { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 18px; padding-top: 60px; }
.container { width: 100%; max-width: 480px; }

.card {
    width: 100%; max-width: 380px; margin: 0 auto;
    padding: 30px 25px;
    background: rgba(255, 240, 246, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(255, 123, 172, 0.25);
    border: 1px solid rgba(255, 182, 193, 0.35);
    text-align: center;
    animation: fadeIn 0.8s ease;
    position: relative;
    z-index: 1;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.title { font-size: 22px; color: #e85b89; margin: 0 0 8px 0; font-weight: bold; }
.subtitle { font-size: 14px; color: #c9779d; margin: 0 0 20px 0; }

.input-box {
    width: 100%; padding: 9px 15px; border-radius: 25px;
    border: 1px solid #ffc1d6; outline: none; font-size: 15px;
    background: rgba(255, 255, 255, 0.8); margin-bottom: 10px;
    color: #5a3e4b; transition: .2s;
}
.input-box:focus { border-color: #ff8ab7; box-shadow: 0 0 0 3px rgba(255,138,183,.15); }
.input-box::placeholder { color: #c9779d; }
#cardKey { letter-spacing: 1px; font-weight: 600; }

.btn {
    width: 100%; padding: 9px 0;
    background: linear-gradient(135deg, #ffb6d6 0%, #ff8ab7 100%);
    color: white; font-size: 16px; border: none; border-radius: 25px;
    cursor: pointer; transition: .25s; margin-bottom: 10px; font-weight: 700;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .6; cursor: not-allowed; }

.label-container { display: flex; justify-content: space-between; margin-top: 5px; }
.label {
    padding: 10px 20px; color: #ff8ab7; font-size: 14px; cursor: pointer;
    transition: .25s; border-radius: 25px; background: rgba(255,255,255,.5);
    flex: 1; text-align: center; margin: 0 3px;
}
.label:hover { color: #e85b89; background: rgba(255,255,255,.8); }
.label:active { transform: scale(.96); }

.section { margin-top: 18px; }
.section-label { display: block; margin-bottom: 8px; color: #c9779d; font-size: 13px; font-weight: 600; text-align: left; }
.device-box {
    width: 100%; min-height: 42px; padding: 10px 13px; border-radius: 14px;
    background: rgba(255,255,255,.6); border: 1px solid #ffc1d6;
    display: flex; align-items: center; gap: 10px;
}
.device-id { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9779d; font-size: 12px; font-family: monospace; }
.small-btn { flex-shrink: 0; border: 0; border-radius: 9px; padding: 8px 10px; color: #fff; background: #ff8ab7; font-size: 12px; cursor: pointer; }
.small-btn:active { transform: scale(.96); }

.options { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; gap: 10px; }
.checkbox { display: flex; align-items: center; gap: 8px; color: #c9779d; font-size: 13px; }
.checkbox input { width: 17px; height: 17px; margin: 0; accent-color: #ff8ab7; }

.status { margin-top: 18px; padding: 15px; border-radius: 15px; border: 1px solid #ffc1d6; background: rgba(255,255,255,.6); display: none; }
.status.show { display: block; }
.status.success { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.07); }
.status.error   { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.07); }
.status.warning { border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.07); }
.status-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: #5a3e4b; }
.status-message { color: #c9779d; font-size: 13px; line-height: 1.6; }

.result { margin-top: 14px; display: none; }
.result.show { display: block; }
.result-item { display: flex; justify-content: space-between; gap: 15px; padding: 11px 0; border-bottom: 1px solid rgba(255,182,193,.3); }
.result-item:last-child { border-bottom: 0; }
.result-name { color: #c9779d; font-size: 13px; }
.result-value { max-width: 62%; text-align: right; word-break: break-word; color: #5a3e4b; font-size: 13px; font-weight: 600; }

.server { margin-top: 20px; padding: 11px 13px; border-radius: 12px; background: rgba(255,255,255,.5); color: #c9779d; font-size: 11px; line-height: 1.5; word-break: break-all; }
.footer { margin-top: 18px; text-align: center; color: #c9779d; font-size: 11px; line-height: 1.6; }

.loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 7px; }
@keyframes spin { to { transform: rotate(360deg); } }

#fbBtn {
  position: fixed; top: 18px; right: 18px; z-index: 99997;
  height: 40px; padding: 0 16px; border-radius: 20px;
  background: rgba(255,138,183,.92); border: 1px solid rgba(255,182,193,.4);
  color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 12px rgba(255,123,172,.3);
}
#fbBtn .dot-new { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: none; }
#fbBtn .dot-new.show { display: block; }

#fbModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); z-index: 99999; justify-content: center; align-items: center; padding: 14px; }
#fbModalInner {
  background: rgba(255,240,246,.96); backdrop-filter: blur(10px);
  border: 1px solid #ffc1d6; border-radius: 14px; padding: 16px;
  width: 100%; max-width: 460px; max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: 0 8px 25px rgba(255,123,172,.2);
}
#fbModalInner h3 { margin: 0 0 12px 0; color: #e85b89; font-size: 15px; }
#fbNewSection { margin-bottom: 12px; }
#fbNewSection label { display: block; font-size: 12px; color: #c9779d; margin-bottom: 5px; }
#fbContent, #fbContact, #fbReplyInput { width: 100%; background: rgba(255,255,255,.7); border: 1px solid #ffc1d6; border-radius: 6px; padding: 9px 10px; color: #5a3e4b; font-size: 13px; outline: none; }
#fbContent:focus, #fbContact:focus, #fbReplyInput:focus { border-color: #ff8ab7; }
textarea { resize: vertical; }
#fbBtnRow { display: flex; gap: 8px; margin-top: 10px; }
#fbBtnRow button { flex: 1; height: 40px; border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; }
#fbCancel { background: #fce4ec; color: #e85b89; }
#fbSubmit { background: #ff8ab7; color: #fff; }
#fbMsg { margin-top: 8px; font-size: 12px; text-align: center; min-height: 16px; }

#fbThreadList { border-top: 1px solid #ffc1d6; padding-top: 12px; overflow: auto; max-height: 50vh; }
.fb-thread-item { padding: 10px; background: rgba(255,255,255,.5); border: 1px solid #ffc1d6; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: .15s; }
.fb-thread-item:hover { border-color: #ff8ab7; }
.fb-thread-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #c9779d; }
.fb-thread-preview { margin-top: 5px; font-size: 12px; color: #5a3e4b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-thread-badge { background: #ef4444; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
.fb-thread-closed { color: #c9779d; font-size: 10px; }

#fbChatView { display: none; flex-direction: column; flex: 1; min-height: 0; }
#fbChatHead { font-size: 12px; color: #c9779d; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
#fbChatHead button { background: #fce4ec; color: #e85b89; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
#fbChatMsgs { flex: 1; overflow: auto; background: rgba(255,255,255,.5); border: 1px solid #ffc1d6; border-radius: 8px; padding: 10px; margin-bottom: 10px; min-height: 200px; }
.msg-row { margin-bottom: 10px; display: flex; flex-direction: column; }
.msg-row.user { align-items: flex-start; }
.msg-row.admin { align-items: flex-end; }
.msg-bubble { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.msg-row.user .msg-bubble { background: #fce4ec; color: #5a3e4b; border-top-left-radius: 2px; }
.msg-row.admin .msg-bubble { background: #ff8ab7; color: #fff; border-top-right-radius: 2px; }
.msg-time { font-size: 10px; color: #c9779d; margin-top: 3px; }

.empty { color: #c9779d; font-size: 13px; text-align: center; padding: 20px; }

#sakura-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* ============================================================ */
/* ============ 公告弹窗 ========== */
/* ============================================================ */
#annModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: 999999;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#annModal.show { display: flex; }

#annModal .confetti {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
}
#annModal .confetti span {
    position: absolute;
    top: -10px;
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: annConfettiDrop 1.5s linear infinite;
}
@keyframes annConfettiDrop {
    0%   { transform: translateY(-100px) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(360deg); }
}

#annModal .md3-card {
    width: 80%;
    max-width: 360px;
    padding: 24px 24px 16px;
    border-radius: 28px;
    background: #FFFBFE;
    box-shadow:
        0 2px 6px rgba(0,0,0,0.25),
        0 1px 3px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: left;
    position: relative;
    z-index: 2;
    animation: annPopUp 0.5s ease-in-out;
    max-height: 85vh;
    overflow-y: auto;
}
@keyframes annPopUp {
    0%   { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

#annModal .card-header { display: flex; align-items: center; gap: 16px; }
#annModal .card-icon {
    width: 48px; height: 48px; border-radius: 24px;
    border: 2px solid #FF8C00;
    object-fit: cover; flex-shrink: 0;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    display: block;
}
#annModal .card-title {
    font-size: 18px; font-weight: 600; color: #FF8C00;
    word-break: break-word;
}
#annModal .support-chip {
    display: inline-flex; align-items: center;
    height: 28px; padding: 0 12px;
    border-radius: 14px;
    background: #FFE4B5;
    border: 1px solid #79747E;
    font-size: 12px; color: #49454F;
    letter-spacing: 0.03em;
    align-self: flex-start;
}
#annModal .card-content {
    font-size: 14px;
    color: rgba(0,0,0,0.75);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}
#annModal .card-actions { display: flex; justify-content: flex-end; }
#annModal .md3-btn {
    height: 40px; padding: 0 24px;
    border-radius: 20px; border: none;
    background: #FF8C00; color: #FFFFFF;
    font-weight: 600; cursor: pointer;
    overflow: hidden; position: relative;
    font-size: 14px; transition: .15s;
}
#annModal .md3-btn:active { transform: scale(.96); background: #FF7A00; }
</style>
</head>
<body>

<button id="fbBtn" type="button" title="反馈">
  反馈
  <span class="dot-new" id="fbNewDot"></span>
</button>

<div class="card">
    <div class="title">卡密验证</div>
    <div class="subtitle">请输入你的激活码</div>

    <input type="text" class="input-box" id="cardKey" placeholder="请输入卡密" />

<!-- ============ 反馈弹窗 ============ -->

</div>

<!-- ============ 公告弹窗（默认显示：0 延迟首屏） ============ -->

  <div class="confetti">

           src="https://p2.ssl.qhimgs1.com/t04cc685f3b4e4323f2.jpg"
           onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 x2=%221%22 y1=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23FFD700%22/%3E%3Cstop offset=%221%22 stop-color=%22%23FF8C00%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2248%22 height=%2248%22 rx=%2224%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M24 11a2.5 2.5 0 0 1 2.5 2.5v1c3.7.9 6.5 4.2 6.5 8.2v4.6l1.6 2.4a1 1 0 0 1-.8 1.6H13.2a1 1 0 0 1-.8-1.6l1.6-2.4v-4.6c0-4 2.8-7.3 6.5-8.2v-1A2.5 2.5 0 0 1 24 11zm0 25a3.2 3.2 0 0 1-3.2-3.1h6.4A3.2 3.2 0 0 1 24 36z%22 fill=%22%23fff%22/%3E%3C/svg%3E'"

<script>
// ============================================================
// 卡密验证（对接后端）
// ============================================================
(function () {
  "use strict";
  const API_BASE = "https://kx.xiaokekx.workers.dev";
  const VERIFY_API = API_BASE + "/api/verify";
  const UNBIND_API = API_BASE + "/api/unbind";
  const SUCCESS_PAGE = "cg.html";
  const BUY_URL = "https://www.baidu.com";
  const CLIENT_SECRET = "a7f3b9c2e8d1460f5b2a8d3c9e7f1a4b6c8d2e5f9a3b7c1d4e8f2a6b9c3d7e1f";

  async function sha256(text) {
    const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buffer)).map(x => x.toString(16).padStart(2, "0")).join("");
  }

  const STORAGE = {
    DEVICE_ID: "card_verify_device_id",
    CARD_KEY: "card_verify_saved_key",
    CARD_KEY_DRAFT: "card_verify_card_key_draft",
    REMEMBER: "card_verify_remember_key",
    AUTO_VERIFY: "card_verify_auto_verify"
  };

  const $ = id => document.getElementById(id) || null;
  const cardKeyInput = $("cardKey");
  const deviceIdElement = $("deviceId");
  const resetDeviceBtn = $("resetDeviceBtn");
  const rememberKey = $("rememberKey");
  const autoVerify = $("autoVerify");
  const verifyBtn = $("verifyBtn");
  const unbindBtn = $("unbindBtn");
  const btnBuy = $("btnBuy");
  const status = $("status");
  const statusTitle = $("statusTitle");
  const statusMessage = $("statusMessage");
  const result = $("result");
  const resultStatus = $("resultStatus");
  const resultExpire = $("resultExpire");
  const resultMaxDevices = $("resultMaxDevices");
  const resultBoundDevices = $("resultBoundDevices");
  const serverUrl = $("serverUrl");

  if (serverUrl) serverUrl.textContent = "";

  function generateDeviceId() {
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let randomPart = "";
    try {
      if (window.crypto && window.crypto.getRandomValues) {
        const bytes = new Uint8Array(4);
        window.crypto.getRandomValues(bytes);
        for (let i = 0; i < 4; i++) randomPart += chars[bytes[i] % chars.length];
      } else throw new Error("crypto unavailable");
    } catch (e) {
      for (let i = 0; i < 4; i++) randomPart += chars[Math.floor(Math.random() * chars.length)];
    }
    return "HIK-" + randomPart;
  }

  function getDeviceId() {
    let id = localStorage.getItem(STORAGE.DEVICE_ID);
    if (!id || !String(id).trim()) {
      id = generateDeviceId();
      localStorage.setItem(STORAGE.DEVICE_ID, id);
    }
    return String(id).trim();
  }

  function updateDeviceDisplay() { if (deviceIdElement) deviceIdElement.textContent = getDeviceId(); }
  function normalizeKey(value) { return String(value || "").trim().toUpperCase().replace(/\s+/g, ""); }
  function isReasonableKey(key) { return !!key && key.length <= 500; }

  function formatExpireTime(value) {
    if (!value) return "-";
    try {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
    } catch (e) { return String(value); }
  }

  function showStatus(type, title, message) {
    if (status) { status.className = "status show " + type; }
    if (statusTitle) { statusTitle.textContent = title; }
    if (statusMessage) { statusMessage.textContent = message; }
  }
  function hideStatus() { if (status) status.className = "status"; }

  function showResult(data) {
    if (!result) return;
    result.classList.add("show");
    resultStatus.textContent = data.ok === true ? "验证成功" : "验证失败";
    resultExpire.textContent = formatExpireTime(data.expires_at);
    resultMaxDevices.textContent = data.max_devices != null ? String(data.max_devices) : "-";
    let boundCount = null;
    if (Array.isArray(data.bound_devices)) boundCount = data.bound_devices.length;
    else if (data.bound_devices_count != null && !Number.isNaN(Number(data.bound_devices_count))) boundCount = Number(data.bound_devices_count);
    else if (data.bound_count != null && !Number.isNaN(Number(data.bound_count))) boundCount = Number(data.bound_count);
    else if (data.devices_count != null && !Number.isNaN(Number(data.devices_count))) boundCount = Number(data.devices_count);
    else if (data.bound_devices != null && !Number.isNaN(Number(data.bound_devices))) boundCount = Number(data.bound_devices);
    resultBoundDevices.textContent = boundCount != null ? boundCount + " " : "-";
  }
  function hideResult() { if (result) result.classList.remove("show"); }

  function getHttpErrorMessage(response, data) {
    const backendMessage = data && typeof data.error === "string" ? data.error : "";
    switch (response.status) {
      case 400: return backendMessage || "请求参数错误，请检查卡密和设备信息。";
      case 403: return backendMessage || "卡密验证失败，可能无效、过期或设备绑定受限。";
      case 429: return backendMessage || "请求过于频繁，请稍后再试。";
      case 404: return "验证接口不存在，请检查服务器 API 地址。";
      case 500: case 502: case 503: case 504: return backendMessage || "验证服务器暂时不可用，请稍后再试。";
      default: return backendMessage || "服务器返回错误 HTTP " + response.status;
    }
  }

  async function buildSignedHeaders(key, deviceId) {
    const ts = Math.floor(Date.now() / 1000).toString();
    const sign = await sha256(key + "|" + deviceId + "|" + ts + "|" + CLIENT_SECRET);
    return { "Content-Type": "application/json", "X-Sign": sign, "X-Ts": ts };
  }

  async function doVerify() {
    const key = normalizeKey(cardKeyInput.value);
    const deviceId = getDeviceId();
    if (!isReasonableKey(key)) {
      showStatus("warning", "请输入卡密", "请先输入有效的卡密后再进行验证");
      cardKeyInput.focus();
      return;
    }
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<span class="loading"></span>正在验证...';
    hideResult();
    showStatus("warning", "正在验证", "正在连接验证服务器，请稍候...");
    try {
      const headers = await buildSignedHeaders(key, deviceId);
      const response = await fetch(VERIFY_API, {
        method: "POST", headers: headers,
        body: JSON.stringify({ key: key, device_id: deviceId }),
        cache: "no-store"
      });
      let data = null;
      const contentType = response.headers.get("content-type") || "";
      if (contentType.toLowerCase().includes("application/json")) {
        try { data = await response.json(); } catch (e) { data = null; }
      } else {
        try { data = JSON.parse(await response.text()); } catch (e) { data = null; }
      }
      if (!response.ok) { showStatus("error", "验证失败", getHttpErrorMessage(response, data)); return; }
      if (!data || data.ok !== true) {
        showStatus("error", "验证失败", data && data.error ? data.error : "服务器返回的验证结果无效。");
        return;
      }
      showResult(data);
      showStatus("success", "验证成功", "卡密验证通过，正在跳转...");
      localStorage.setItem(STORAGE.CARD_KEY_DRAFT, key);
      localStorage.setItem(STORAGE.CARD_KEY, key);
      localStorage.setItem(STORAGE.REMEMBER, "1");
      localStorage.setItem(STORAGE.AUTO_VERIFY, (autoVerify && autoVerify.checked) ? "1" : "0");
      setTimeout(function () { window.location.href = SUCCESS_PAGE; }, 1200);
    } catch (error) {
      console.error("Verify request error:", error);
      showStatus("error", "无法连接验证服务器",
        "请求没有正常到达服务器。请检查网络、WebCat 网络权限，以及 Cloudflare Worker 的 CORS 配置。");
    } finally {
      verifyBtn.disabled = false;
      verifyBtn.textContent = "验证卡密";
    }
  }

  async function doUnbind() {
    const key = normalizeKey(cardKeyInput.value);
    const deviceId = getDeviceId();
    if (!isReasonableKey(key)) {
      showStatus("warning", "请输入卡密", "请先输入需要解绑的卡密");
      cardKeyInput.focus();
      return;
    }
    if (!window.confirm("确定要解绑当前设备吗？\n\n解绑后，该卡密将不再绑定当前设备；是否能重新绑定取决于服务器规则。")) return;
    unbindBtn.disabled = true;
    verifyBtn.disabled = true;
    unbindBtn.textContent = "正在解绑...";
    hideResult();
    showStatus("warning", "正在解绑", "正在连接服务器处理设备解绑，请稍候...");
    try {
      const headers = await buildSignedHeaders(key, deviceId);
      const response = await fetch(UNBIND_API, {
        method: "POST", headers: headers,
        body: JSON.stringify({ key: key, device_id: deviceId }),
        cache: "no-store"
      });
      let data = null;
      const contentType = response.headers.get("content-type") || "";
      if (contentType.toLowerCase().includes("application/json")) {
        try { data = await response.json(); } catch (e) { data = null; }
      } else {
        try { data = JSON.parse(await response.text()); } catch (e) { data = null; }
      }
      if (!response.ok) {
        let message = "";
        if (data && typeof data.error === "string") message = data.error;
        if (response.status === 404) message = message || "服务器未部署 /api/unbind 解绑接口。";
        else if (response.status === 400) message = message || "解绑请求参数错误。";
        else if (response.status === 403) message = message || "服务器拒绝解绑。";
        else if (response.status === 429) message = message || "操作过于频繁，请稍后再试。";
        else message = message || "解绑失败，服务器返回 HTTP " + response.status;
        showStatus("error", "解绑失败", message);
        return;
      }
      if (!data || data.ok !== true) {
        showStatus("error", "解绑失败", data && data.error ? data.error : "服务器返回的解绑结果无效。");
        return;
      }
      showStatus("success", "解绑成功", data.message || "当前设备已成功从该卡密中解绑。");
      hideResult();
    } catch (error) {
      console.error("Unbind request error:", error);
      showStatus("error", "无法连接验证服务器",
        "解绑请求没有正常到达服务器。请检查网络、CORS，以及 Cloudflare Worker 是否已更新。");
    } finally {
      unbindBtn.disabled = false;
      verifyBtn.disabled = false;
      unbindBtn.textContent = "解绑卡密";
    }
  }

  function resetDevice() {
    if (!window.confirm("确定要重新生成设备 ID 吗？\n\n如果服务器已经绑定当前旧设备，重新生成后服务器仍可能认为旧设备已经占用名额。")) return;
    localStorage.removeItem(STORAGE.DEVICE_ID);
    updateDeviceDisplay();
    showStatus("warning", "设备 ID 已重置", "新的设备 ID 已生成。");
  }

  function formatCardKey(value) {
    let clean = String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (clean.length === 16) {
      return clean.substring(0,4) + "-" + clean.substring(4,8) + "-" + clean.substring(8,12) + "-" + clean.substring(12,16);
    }
    return value.toUpperCase();
  }

  btnBuy.addEventListener("click", function () {
    window.location.href = BUY_URL;
  });

  verifyBtn.addEventListener("click", doVerify);
  unbindBtn.addEventListener("click", doUnbind);
  cardKeyInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); doVerify(); }
  });
  cardKeyInput.addEventListener("input", function () {
    const clean = cardKeyInput.value.replace(/[^a-zA-Z0-9]/g, "");
    if (clean.length === 16) cardKeyInput.value = formatCardKey(clean);
    const draft = normalizeKey(cardKeyInput.value);
    if (draft) localStorage.setItem(STORAGE.CARD_KEY_DRAFT, draft);
    else localStorage.removeItem(STORAGE.CARD_KEY_DRAFT);
  });
  if (resetDeviceBtn) resetDeviceBtn.addEventListener("click", resetDevice);
  if (rememberKey) rememberKey.addEventListener("change", function () {
    localStorage.setItem(STORAGE.REMEMBER, rememberKey.checked ? "1" : "0");
    if (!rememberKey.checked) localStorage.removeItem(STORAGE.CARD_KEY);
    else {
      const key = normalizeKey(cardKeyInput.value);
      if (key) {
        localStorage.setItem(STORAGE.CARD_KEY, key);
        localStorage.setItem(STORAGE.CARD_KEY_DRAFT, key);
      }
    }
  });
  if (autoVerify) autoVerify.addEventListener("change", function () {
    localStorage.setItem(STORAGE.AUTO_VERIFY, (autoVerify && autoVerify.checked) ? "1" : "0");
  });

  function init() {
    updateDeviceDisplay();
    const remember = localStorage.getItem(STORAGE.REMEMBER) === "1";
    if (rememberKey) rememberKey.checked = remember;
    if (remember) {
      const savedKey = localStorage.getItem(STORAGE.CARD_KEY);
      if (savedKey) cardKeyInput.value = formatCardKey(savedKey);
    }
    if (!cardKeyInput.value.trim()) {
      const savedKey = localStorage.getItem(STORAGE.CARD_KEY);
      if (savedKey) cardKeyInput.value = formatCardKey(savedKey);
    }
    if (!cardKeyInput.value.trim()) {
      const draftKey = localStorage.getItem(STORAGE.CARD_KEY_DRAFT);
      if (draftKey) cardKeyInput.value = formatCardKey(draftKey);
    }
    const auto = localStorage.getItem(STORAGE.AUTO_VERIFY) === "1";
    if (autoVerify) autoVerify.checked = auto;
    if (auto && cardKeyInput.value.trim()) setTimeout(doVerify, 800);
  }

  window.addEventListener("pagehide", function () {
    const key = normalizeKey(cardKeyInput.value);
    if (key) localStorage.setItem(STORAGE.CARD_KEY_DRAFT, key);
  });

  init();
})();

// 反馈 / 客服对话
// ============================================================
(function(){
  "use strict";
  var MAIN_API = "https://xiaoke.xiaokettkx.workers.dev";

  var fbBtn = document.getElementById("fbBtn");
  var fbNewDot = document.getElementById("fbNewDot");
  var fbModal = document.getElementById("fbModal");
  var fbMainView = document.getElementById("fbMainView");
  var fbChatView = document.getElementById("fbChatView");
  var fbContent = document.getElementById("fbContent");
  var fbContact = document.getElementById("fbContact");
  var fbCancel = document.getElementById("fbCancel");
  var fbSubmit = document.getElementById("fbSubmit");
  var fbMsg = document.getElementById("fbMsg");
  var fbThreadListBody = document.getElementById("fbThreadListBody");
  var fbBackBtn = document.getElementById("fbBackBtn");
  var fbChatHeadText = document.getElementById("fbChatHeadText");
  var fbChatMsgs = document.getElementById("fbChatMsgs");
  var fbReplyInput = document.getElementById("fbReplyInput");
  var fbReplySubmit = document.getElementById("fbReplySubmit");
  var fbMsg2 = document.getElementById("fbMsg2");

  var currentThreadId = null;
  var unreadThreadIds = {};

  function getDeviceId() {
    try { return localStorage.getItem("card_verify_device_id") || ""; } catch (_) { return ""; }
  }
  function esc(v) {
    return String(v || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function showToast(msg, err) {
    if (err) fbMsg.style.color = "#ef4444"; else fbMsg.style.color = "#22c55e";
    fbMsg.textContent = msg;
    setTimeout(function(){ fbMsg.textContent = ""; }, 2500);
  }

  function refreshNewDot() {
    var hasUnread = false;
    for (var k in unreadThreadIds) {
      if (unreadThreadIds[k]) { hasUnread = true; break; }
    }
    if (hasUnread) fbNewDot.classList.add("show");
    else fbNewDot.classList.remove("show");
  }

  async function loadThreadList() {
    var did = getDeviceId();
    if (!did) { fbThreadListBody.innerHTML = '<div class="empty">暂无反馈</div>'; return; }
    try {
      var res = await fetch(MAIN_API + "/api/feedback/mine?device_id=" + encodeURIComponent(did), { cache: "no-store" });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok || !data.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
      var list = data.list || [];

      unreadThreadIds = {};
      for (var i = 0; i < list.length; i++) {
        if (list[i].unread_user > 0) unreadThreadIds[list[i].id] = true;
      }
      refreshNewDot();

      if (!list.length) {
        fbThreadListBody.innerHTML = '<div class="empty">暂无反馈</div>';
        return;
      }
      var html = "";
      for (var j = 0; j < list.length; j++) {
        var t = list[j];
        var preview = t.last_role === "admin" ? "【管理员】" : "【我】";
        preview += " " + (t.last_content || "").slice(0, 60);
        var badge = t.unread_user > 0 ? '<span class="fb-thread-badge">新</span>' : '';
        var closedTag = t.status === "closed" ? '<span class="fb-thread-closed">（已关闭）</span>' : '';
        html += '<div class="fb-thread-item" data-id="' + t.id + '">' +
          '<div class="fb-thread-head">' +
            '<span>' + new Date(t.last_at).toLocaleString("zh-CN", { hour12: false }) + badge + '</span>' +
            '<span>' + closedTag + '</span>' +
          '</div>' +
          '<div class="fb-thread-preview">' + esc(preview) + '</div>' +
        '</div>';
      }
      fbThreadListBody.innerHTML = html;
    } catch (e) {
      var msg = e && e.message ? e.message : "网络连接失败";
      fbThreadListBody.innerHTML = '<div class="empty">加载失败<br><span style="font-size:11px;color:#c9779d;">' + esc(msg) + '</span><br><button type="button" id="fbRetryLoad" style="margin-top:8px;padding:6px 12px;border:0;border-radius:6px;background:#ff8ab7;color:#fff;cursor:pointer;">重新加载</button></div>';
      var retry = document.getElementById("fbRetryLoad");
      if (retry) retry.addEventListener("click", loadThreadList);
    }
  }

  fbThreadListBody.addEventListener("click", function(e){
    var item = e.target.closest(".fb-thread-item");
    if (!item) return;
    openThread(Number(item.dataset.id));
  });

  async function openThread(id) {
    currentThreadId = id;
    fbMainView.style.display = "none";
    fbChatView.style.display = "flex";
    fbChatHeadText.textContent = "加载中...";
    fbChatMsgs.innerHTML = "";
    fbMsg2.textContent = "";

    if (unreadThreadIds[id]) {
      delete unreadThreadIds[id];
      refreshNewDot();
    }
    try {
      await fetch(MAIN_API + "/api/feedback/read", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: id, device_id: getDeviceId() }),
        cache: "no-store"
      });
    } catch (_) {}
    try {
      var did = getDeviceId();
      var res = await fetch(MAIN_API + "/api/feedback/messages/" + id + "?device_id=" + encodeURIComponent(did), { cache: "no-store" });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
      var msgs = data.messages || [];
      var status = data.status || "open";
      fbChatHeadText.innerHTML = "会话 #" + id + " " + (status === "closed" ? '<span style="color:#c9779d;">（已关闭）</span>' : '');

      var html = "";
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var role = m.from_role === "admin" ? "admin" : "user";
        var roleLabel = role === "admin" ? "管理员" : "我";
        html += '<div class="msg-row ' + role + '">' +
          '<div class="msg-bubble">' + esc(m.content) + '</div>' +
          '<div class="msg-time">' + roleLabel + ' · ' + new Date(m.at).toLocaleString("zh-CN", { hour12: false }) + '</div>' +
        '</div>';
      }
      fbChatMsgs.innerHTML = html || '<div class="empty">暂无消息</div>';
      setTimeout(function(){ fbChatMsgs.scrollTop = fbChatMsgs.scrollHeight; }, 30);

      if (status === "closed") {
        fbReplyInput.disabled = true;
        fbReplySubmit.disabled = true;
        fbReplyInput.placeholder = "会话已关闭，无法继续追问";
      } else {
        fbReplyInput.disabled = false;
        fbReplySubmit.disabled = false;
        fbReplyInput.placeholder = "继续追问...";
      }
    } catch (e) {
      fbChatHeadText.textContent = "加载失败";
      fbChatMsgs.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    }
  }

  fbBackBtn.addEventListener("click", function(){
    currentThreadId = null;
    fbChatView.style.display = "none";
    fbMainView.style.display = "block";
    loadThreadList();
  });

  fbReplySubmit.addEventListener("click", async function(){
    if (!currentThreadId) return;
    var content = String(fbReplyInput.value || "").trim();
    if (!content) { fbMsg2.style.color = "#ef4444"; fbMsg2.textContent = "内容不能为空"; return; }
    fbReplySubmit.disabled = true; fbReplySubmit.textContent = "发送中...";
    try {
      var did = getDeviceId();
      var res = await fetch(MAIN_API + "/api/feedback/reply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: currentThreadId, content: content, device_id: did }),
        cache: "no-store"
      });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
      fbReplyInput.value = "";
      fbMsg2.style.color = "#22c55e";
      fbMsg2.textContent = "已发送";
      await openThread(currentThreadId);
      loadThreadList();
    } catch (e) {
      fbMsg2.style.color = "#ef4444";
      fbMsg2.textContent = "发送失败：" + e.message;
    } finally {
      fbReplySubmit.disabled = false; fbReplySubmit.textContent = "发送";
    }
  });

  fbBtn.addEventListener("click", function(){
    fbModal.style.display = "flex";
    fbMsg.textContent = "";
    fbContent.value = "";
    fbContact.value = "";
    fbMainView.style.display = "block";
    fbChatView.style.display = "none";
    currentThreadId = null;
    loadThreadList();
    setTimeout(function(){ fbContent.focus(); }, 100);
  });

  fbCancel.addEventListener("click", function(){ fbModal.style.display = "none"; });
  fbModal.addEventListener("click", function(e){ if (e.target === fbModal) fbModal.style.display = "none"; });

  fbSubmit.addEventListener("click", async function(){
    var content = String(fbContent.value || "").trim();
    var contact = String(fbContact.value || "").trim();
    if (!content) { showToast("请填写反馈内容", true); return; }

    try {
      var did = getDeviceId();
      var res = await fetch(MAIN_API + "/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: content, contact: contact, device_id: did, page: location.pathname }),
        cache: "no-store"

      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
      showToast("提交成功，感谢您的反馈！", false);
      fbContent.value = "";
      fbContact.value = "";

    } catch (e) {
      showToast("提交失败：" + e.message, true);
    } finally {
      fbSubmit.disabled = false; fbSubmit.textContent = "提交";
    }
  });

  async function checkUnread() {
    var did = getDeviceId();
    if (!did) return;
    try {
      var res = await fetch(MAIN_API + "/api/feedback/mine?device_id=" + encodeURIComponent(did), { cache: "no-store" });
      var data = await res.json().catch(function(){ return {}; });
      var list = (data && data.list) || [];
      unreadThreadIds = {};
      for (var i = 0; i < list.length; i++) {
        if (list[i].unread_user > 0) unreadThreadIds[list[i].id] = true;
      }
      refreshNewDot();
    } catch (_) {}
  }

  setTimeout(checkUnread, 800);
  setInterval(checkUnread, 10000);
})();

// ============================================================
// 公告系统（实时轮询版 · 3秒自动同步）
// 策略：
//   1) 首屏：HTML 默认显示弹窗（0 延迟）
//   2) 有缓存：立即用缓存填充
//   3) 无缓存：显示"加载中"骨架
//   4) 每 3 秒轮询一次，后台改动自动同步，用户无需刷新
//   5) 页面隐藏暂停轮询，节省流量
// ============================================================
(function(){
  "use strict";
  var MAIN_API = "https://xiaoke.xiaokettkx.workers.dev";
  var ANN_API = MAIN_API + "/api/announcement";
  var CACHE_KEY = "ann_cache_v2";
  var POLL_INTERVAL = 1000;   // 3 秒轮询一次

  var annModal = document.getElementById("annModal");
  var annIcon = document.getElementById("annIcon");
  var annTitle = document.getElementById("annTitle");
  var annChip = document.getElementById("annChip");
  var annContent = document.getElementById("annContent");
  var annOk = document.getElementById("annOk");

  function showAnn() { if (annModal) annModal.classList.add("show"); }
  function closeAnn() { if (annModal) annModal.classList.remove("show"); }

  if (annOk) annOk.addEventListener("click", closeAnn);
  if (annModal) annModal.addEventListener("click", function(e){
    if (e.target === annModal) closeAnn();
  });

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }
    catch (_) { return null; }
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
  }
  function clearCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch (_) {}
  }

  function renderAnn(title, content, icon) {
    if (annTitle) annTitle.textContent = title || "系统公告";
    if (annContent) annContent.textContent = String(content || "");
    if (annIcon && icon && String(icon).trim()) annIcon.src = icon;
  }

  // 记录最后一次渲染的内容签名，避免重复渲染
  var lastSig = "";

  function applyBackendData(data) {
    if (!data || data.ok !== true) {
      // 后端异常：无缓存就关闭弹窗（避免"加载中"一直挂着）
      if (!readCache()) closeAnn();
      return;
    }
    var enabled = data.enabled === true;
    var content = String(data.content || "").trim();
    var title = data.title || "系统公告";
    var icon = data.icon || "";

    var sig = (enabled ? "1" : "0") + "|" + title + "|" + content + "|" + icon;
    if (sig === lastSig) return;   // 内容没变，不动
    lastSig = sig;

    if (enabled && content) {
      writeCache({ enabled: true, title: title, content: content, icon: icon });
      renderAnn(title, content, icon);
      showAnn();
    } else {
      clearCache();
      closeAnn();
    }
  }

  // ========== 1) 首屏：有缓存立即填充 ==========
  var cached = readCache();
  if (cached && cached.enabled === true &&
      cached.content && String(cached.content).trim()) {
    renderAnn(cached.title, cached.content, cached.icon);
    lastSig = "1|" + (cached.title || "") + "|" + cached.content + "|" + (cached.icon || "");
  }
  // HTML 里 #annModal 默认带 show，无需再调 showAnn()

  // ========== 2) 请求函数 ==========
  function fetchAnn() {
    fetch(ANN_API, { cache: "no-store" })
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(applyBackendData)
      .catch(function(){ /* 网络异常：保持现状 */ });
  }

  // ========== 3) 首次立即拉一次 ==========
  fetchAnn();

  // ========== 4) 每 3 秒轮询 ==========
  var pollTimer = null;
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(fetchAnn, POLL_INTERVAL);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  startPolling();

  // 页面隐藏暂停，可见时立即拉一次并恢复轮询
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) stopPolling();
    else { fetchAnn(); startPolling(); }
  });
})();
</script>

<!-- 樱花飘落画布 -->
<canvas id="sakura-canvas"></canvas>

<script>
// ============================================================
// 樱花飘落粒子效果
// ============================================================
(function() {
    "use strict";
    var canvas = document.getElementById("sakura-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var W = window.innerWidth;
    var H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    var SAKURA_COUNT = 45;
    var petals = [];

    var petalColors = [
        "rgba(255, 183, 197, 0.85)",
        "rgba(255, 192, 203, 0.80)",
        "rgba(255, 209, 218, 0.82)",
        "rgba(255, 170, 185, 0.78)",
        "rgba(255, 195, 210, 0.83)",
        "rgba(253, 198, 212, 0.75)",
    ];

    function Petal() { this.reset(); }

    Petal.prototype.reset = function() {
        this.x = Math.random() * W;
        this.y = Math.random() * -H;
        this.size = Math.random() * 8 + 5;
        this.speedY = Math.random() * 1.2 + 0.4;
        this.speedX = Math.random() * 0.6 - 0.3;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.02;
        this.opacity = Math.random() * 0.4 + 0.5;
        this.wobbleAmp = Math.random() * 1.5 + 0.5;
        this.wobbleSpeed = Math.random() * 0.02 + 0.01;
        this.wobbleOffset = Math.random() * Math.PI * 2;
        this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
        this.time = 0;
    };

    Petal.prototype.update = function() {
        this.time++;
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp * 0.3;
        this.rotation += this.rotationSpeed;
        if (this.y > H + 20 || this.x < -20 || this.x > W + 20) {
            this.reset();
            this.y = -20;
        }
    };

    Petal.prototype.draw = function() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;
        var s = this.size;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.6);
        ctx.bezierCurveTo(s * 0.5, -s * 0.8, s * 0.8, -s * 0.2, 0, s * 0.3);
        ctx.bezierCurveTo(-s * 0.8, -s * 0.2, -s * 0.5, -s * 0.8, 0, -s * 0.6);
        ctx.fill();
        ctx.restore();
    };

    for (var i = 0; i < SAKURA_COUNT; i++) {
        var p = new Petal();
        p.y = Math.random() * H;
        petals.push(p);
    }

    function animate() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < petals.length; i++) {
            petals[i].update();
            petals[i].draw();
        }
        requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", function() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
    });
})();
</script>
